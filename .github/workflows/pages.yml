name: Deploy demo to Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage the static site
        run: |
          mkdir -p _site/dist
          cp index.html mention.js mention.css _site/
          cp dist/mention.min.js dist/mention.min.css dist/mention.d.ts _site/dist/
          # Use the exact successfully tested revision for Pages asset URLs.
          # This avoids mixing newly deployed demo HTML with cached old JS.
          REV="${{ github.event.workflow_run.head_sha }}"
          sed -i -e "s|href=\"mention.css\"|href=\"mention.css?v=$REV\"|" \
                 -e "s|src=\"mention.js\"|src=\"mention.js?v=$REV\"|" _site/index.html
          grep -F "mention.css?v=$REV" _site/index.html
          grep -F "mention.js?v=$REV" _site/index.html
          test -s _site/index.html
          test -s _site/mention.js
          test -s _site/dist/mention.min.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
